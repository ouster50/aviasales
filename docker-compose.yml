version: "3.9"

services:
  flight-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flight_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flight_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  flyway-flight:
    image: flyway/flyway:10
    command: -url=jdbc:postgresql://flight-db:5432/flight_db -user=postgres -password=postgres -connectRetries=10 migrate
    volumes:
      - ./migrations/flight-db:/flyway/sql
    depends_on:
      flight-db:
        condition: service_healthy

  flyway-booking:
    image: flyway/flyway:10
    command: -url=jdbc:postgresql://booking-db:5432/booking_db -user=postgres -password=postgres -connectRetries=10 migrate
    volumes:
      - ./migrations/booking-db:/flyway/sql
    depends_on:
      booking-db:
        condition: service_healthy

  flight-service:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    environment:
      GRPC_PORT: "50051"
      FLIGHT_DB_HOST: flight-db
      FLIGHT_DB_PORT: "5432"
      FLIGHT_DB_NAME: flight_db
      FLIGHT_DB_USER: postgres
      FLIGHT_DB_PASSWORD: postgres
      GRPC_API_KEY: "secret"
    ports:
      - "50051:50051"
    depends_on:
      flyway-flight:
        condition: service_completed_successfully

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      FLIGHT_SERVICE_HOST: flight-service
      FLIGHT_SERVICE_PORT: "50051"
      BOOKING_DB_HOST: booking-db
      BOOKING_DB_PORT: "5432"
      BOOKING_DB_NAME: booking_db
      BOOKING_DB_USER: postgres
      BOOKING_DB_PASSWORD: postgres
      GRPC_API_KEY: "secret"
    ports:
      - "8000:8000"
    depends_on:
      flyway-booking:
        condition: service_completed_successfully
      flight-service:
        condition: service_started

volumes:
  flight-db-data:
  booking-db-data:
